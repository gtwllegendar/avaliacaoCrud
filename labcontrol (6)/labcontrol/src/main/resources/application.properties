spring.application.name=labcontrol

# Configuracao portavel: funciona em qualquer maquina.
# Padrao: MySQL em localhost:3306, usuario root, senha root (o mesmo do docker-compose.yml).
# Para usar outra senha SEM mexer neste arquivo, crie
# src/main/resources/application-local.properties (ele e ignorado pelo Git) ou use a variavel DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/labcontrol?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Arquivo opcional com configuracoes pessoais (nao e enviado ao Git)
spring.config.import=optional:classpath:application-local.properties
